[package]
name = "hisab"
version = "0.1.0"
description = "Arabic offline-first accounting application"
authors = ["Hisab"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
